<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img" aria-labelledby="title desc"><title id="title">规划与执行：验证计划，逐步完成</title><desc id="desc">中文教学结构图，节点和箭头表示应用可观察的数据流；不是模型内部推理。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26344b;font-size:15px}.node{fill:#fff;stroke:#9dabc0;stroke-width:1.4}.accent{fill:#edf3ff;stroke:#3569cf}.boundary{fill:#f7f9fc;stroke:#9dabc0;stroke-dasharray:6 5}.edge{fill:none;stroke:#63748f;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#526079}.title{font-size:20px;font-weight:600}.small{font-size:12px}@media(prefers-color-scheme:dark){text{fill:#e5ecfa}.node{fill:#242e3d;stroke:#7d8eab}.accent{fill:#213a61;stroke:#86b2ff}.boundary{fill:#1b2431;stroke:#7d8eab}.label{fill:#bdc9dd}.edge{stroke:#a6b9d7}}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7185a4"/></marker></defs><text x="24" y="32" class="title">规划与执行：验证计划，逐步完成</text><path d="M375 120V155" class="edge"/><path d="M375 210V245" class="edge"/><path d="M375 300V335" class="edge"/><text x="385" y="323" class="label">合法</text><path d="M375 390V435" class="edge"/><text x="390" y="417" class="label">全部完成或停止</text><path d="M250 362H195" class="edge"/><path d="M112 335V182H250" class="edge"/><text x="30" y="162" class="label">重新规划；限制次数</text><path d="M500 273H550" class="edge"/><rect x="250" y="65" width="250" height="55" rx="7" class="node "/><text x="375.0" y="97.5" text-anchor="middle">用户目标 + 明确约束</text><rect x="250" y="155" width="250" height="55" rx="7" class="node accent"/><text x="375.0" y="187.5" text-anchor="middle">生成结构化子任务与依赖</text><rect x="250" y="245" width="250" height="55" rx="7" class="node "/><text x="375.0" y="277.5" text-anchor="middle">程序验证：字段 / 依赖 / 权限</text><rect x="250" y="335" width="250" height="55" rx="7" class="node accent"/><text x="375.0" y="367.5" text-anchor="middle">只执行依赖已满足的任务</text><rect x="250" y="435" width="250" height="55" rx="7" class="node "/><text x="375.0" y="467.5" text-anchor="middle">汇总成功结果与未完成事项</text><rect x="30" y="335" width="165" height="55" rx="7" class="node "/><text x="112.5" y="367.5" text-anchor="middle">失败或条件改变</text><rect x="550" y="245" width="180" height="55" rx="7" class="node "/><text x="640.0" y="277.5" text-anchor="middle">非法计划 → 退回</text></svg>