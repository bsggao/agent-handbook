<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="title desc"><title id="title">部署架构与安全边界</title><desc id="desc">中文教学结构图，节点和箭头表示应用可观察的数据流；不是模型内部推理。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26344b;font-size:15px}.node{fill:#fff;stroke:#9dabc0;stroke-width:1.4}.accent{fill:#edf3ff;stroke:#3569cf}.boundary{fill:#f7f9fc;stroke:#9dabc0;stroke-dasharray:6 5}.edge{fill:none;stroke:#63748f;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#526079}.title{font-size:20px;font-weight:600}.small{font-size:12px}@media(prefers-color-scheme:dark){text{fill:#e5ecfa}.node{fill:#242e3d;stroke:#7d8eab}.accent{fill:#213a61;stroke:#86b2ff}.boundary{fill:#1b2431;stroke:#7d8eab}.label{fill:#bdc9dd}.edge{stroke:#a6b9d7}}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7185a4"/></marker></defs><text x="24" y="32" class="title">部署架构与安全边界</text><rect x="245" y="65" width="290" height="410" rx="10" class="boundary"/><text x="285" y="500" class="small">可信应用边界；外部文档、网页和工具结果均需校验，不具有指令权限。</text><path d="M190 130H275" class="edge"/><text x="202" y="116" class="label">HTTPS</text><path d="M390 160V230" class="edge"/><path d="M390 290V385" class="edge"/><text x="401" y="344" class="label">状态读写</text><path d="M505 250H565V110H640" class="edge"/><text x="558" y="198" class="label">授权出站</text><path d="M505 260H640" class="edge"/><text x="545" y="248" class="label">工具执行</text><path d="M505 277H570V415H640" class="edge"/><text x="575" y="400" class="label">应用事件</text><rect x="30" y="100" width="160" height="60" rx="7" class="node "/><text x="110.0" y="124.5" text-anchor="middle">浏览器 / 用户</text><text x="110.0" y="145.5" text-anchor="middle">无服务端密钥</text><rect x="275" y="100" width="230" height="60" rx="7" class="node accent"/><text x="390.0" y="124.5" text-anchor="middle">后端入口</text><text x="390.0" y="145.5" text-anchor="middle">身份验证 / 限流 / 授权</text><rect x="275" y="230" width="230" height="60" rx="7" class="node accent"/><text x="390.0" y="254.5" text-anchor="middle">Agent 执行进程</text><text x="390.0" y="275.5" text-anchor="middle">工具校验 / 超时 / 预算</text><rect x="275" y="385" width="230" height="60" rx="7" class="node "/><text x="390.0" y="409.5" text-anchor="middle">外部状态存储</text><text x="390.0" y="430.5" text-anchor="middle">会话隔离 / 版本 / 记忆</text><rect x="640" y="80" width="185" height="60" rx="7" class="node "/><text x="732.5" y="104.5" text-anchor="middle">模型服务</text><text x="732.5" y="125.5" text-anchor="middle">最小必要上下文</text><rect x="640" y="230" width="185" height="60" rx="7" class="node "/><text x="732.5" y="254.5" text-anchor="middle">MCP / 业务工具</text><text x="732.5" y="275.5" text-anchor="middle">各自的受限身份</text><rect x="640" y="385" width="185" height="60" rx="7" class="node "/><text x="732.5" y="409.5" text-anchor="middle">遥测与审计</text><text x="732.5" y="430.5" text-anchor="middle">脱敏 / 保留期限</text></svg>