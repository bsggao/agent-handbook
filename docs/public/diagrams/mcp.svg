<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc"><title id="title">MCP：宿主中的客户端连接工具服务器</title><desc id="desc">中文教学结构图，节点和箭头表示应用可观察的数据流；不是模型内部推理。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26344b;font-size:15px}.node{fill:#fff;stroke:#9dabc0;stroke-width:1.4}.accent{fill:#edf3ff;stroke:#3569cf}.boundary{fill:#f7f9fc;stroke:#9dabc0;stroke-dasharray:6 5}.edge{fill:none;stroke:#63748f;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#526079}.title{font-size:20px;font-weight:600}.small{font-size:12px}@media(prefers-color-scheme:dark){text{fill:#e5ecfa}.node{fill:#242e3d;stroke:#7d8eab}.accent{fill:#213a61;stroke:#86b2ff}.boundary{fill:#1b2431;stroke:#7d8eab}.label{fill:#bdc9dd}.edge{stroke:#a6b9d7}}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7185a4"/></marker></defs><text x="24" y="32" class="title">MCP：宿主中的客户端连接工具服务器</text><rect x="30" y="60" width="305" height="320" rx="10" class="boundary"/><text x="40" y="408" class="small">工具权限、用户授权与输出校验由宿主及服务实现；采用协议不会自动获得信任。</text><path d="M182 180V260" class="edge"/><text x="197" y="224" class="label">宿主管理客户端</text><path d="M300 288H345V208H420" class="edge"/><text x="327" y="275" class="label">发现 / 调用</text><path d="M420 235H370V315H182V315" class="edge"/><text x="313" y="336" class="label">结果 / 错误</text><path d="M605 202L650 115" class="edge"/><path d="M605 218L650 248" class="edge"/><path d="M605 235L650 365" class="edge"/><rect x="65" y="115" width="235" height="65" rx="7" class="node accent"/><text x="182.5" y="142.0" text-anchor="middle">宿主应用 Host</text><text x="182.5" y="163.0" text-anchor="middle">模型 + 权限与生命周期管理</text><rect x="65" y="260" width="235" height="55" rx="7" class="node "/><text x="182.5" y="292.5" text-anchor="middle">MCP 客户端 Client</text><rect x="420" y="185" width="185" height="65" rx="7" class="node accent"/><text x="512.5" y="212.0" text-anchor="middle">MCP 服务器 Server</text><text x="512.5" y="233.0" text-anchor="middle">声明与暴露能力</text><rect x="650" y="85" width="145" height="55" rx="7" class="node "/><text x="722.5" y="117.5" text-anchor="middle">工具函数 / API</text><rect x="650" y="220" width="145" height="55" rx="7" class="node "/><text x="722.5" y="252.5" text-anchor="middle">资源 Resources</text><rect x="650" y="340" width="145" height="55" rx="7" class="node "/><text x="722.5" y="372.5" text-anchor="middle">提示模板 Prompts</text></svg>