<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="title desc"><title id="title">普通 RAG 与 Agentic RAG</title><desc id="desc">中文教学结构图，节点和箭头表示应用可观察的数据流；不是模型内部推理。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26344b;font-size:15px}.node{fill:#fff;stroke:#9dabc0;stroke-width:1.4}.accent{fill:#edf3ff;stroke:#3569cf}.boundary{fill:#f7f9fc;stroke:#9dabc0;stroke-dasharray:6 5}.edge{fill:none;stroke:#63748f;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#526079}.title{font-size:20px;font-weight:600}.small{font-size:12px}@media(prefers-color-scheme:dark){text{fill:#e5ecfa}.node{fill:#242e3d;stroke:#7d8eab}.accent{fill:#213a61;stroke:#86b2ff}.boundary{fill:#1b2431;stroke:#7d8eab}.label{fill:#bdc9dd}.edge{stroke:#a6b9d7}}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7185a4"/></marker></defs><text x="24" y="32" class="title">普通 RAG 与 Agentic RAG</text><path d="M210 112H300" class="edge"/><path d="M500 112H580" class="edge"/><path d="M210 262H300" class="edge"/><path d="M500 262H580" class="edge"/><path d="M685 290V340" class="edge"/><path d="M685 235V185H400V235" class="edge"/><text x="310" y="175" class="label">不足：改写查询 / 换来源（有预算）</text><path d="M400 290V340" class="edge"/><text x="420" y="320" class="label">预算耗尽</text><rect x="30" y="85" width="180" height="55" rx="7" class="node "/><text x="120.0" y="117.5" text-anchor="middle">问题</text><rect x="300" y="85" width="200" height="55" rx="7" class="node "/><text x="400.0" y="117.5" text-anchor="middle">固定检索步骤</text><rect x="580" y="85" width="210" height="55" rx="7" class="node "/><text x="685.0" y="117.5" text-anchor="middle">证据 + 模型 → 回答</text><rect x="30" y="235" width="180" height="55" rx="7" class="node accent"/><text x="120.0" y="267.5" text-anchor="middle">问题 + 当前状态</text><rect x="300" y="235" width="200" height="55" rx=