<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="title desc"><title id="title">Agent 执行循环与退出边界</title><desc id="desc">中文教学结构图，节点和箭头表示应用可观察的数据流；不是模型内部推理。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26344b;font-size:15px}.node{fill:#fff;stroke:#9dabc0;stroke-width:1.4}.accent{fill:#edf3ff;stroke:#3569cf}.boundary{fill:#f7f9fc;stroke:#9dabc0;stroke-dasharray:6 5}.edge{fill:none;stroke:#63748f;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#526079}.title{font-size:20px;font-weight:600}.small{font-size:12px}@media(prefers-color-scheme:dark){text{fill:#e5ecfa}.node{fill:#242e3d;stroke:#7d8eab}.accent{fill:#213a61;stroke:#86b2ff}.boundary{fill:#1b2431;stroke:#7d8eab}.label{fill:#bdc9dd}.edge{stroke:#a6b9d7}}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7185a4"/></marker></defs><text x="24" y="32" class="title">Agent 执行循环与退出边界</text><path d="M385 120V155" class="edge"/><path d="M385 210V245" class="edge"/><text x="400" y="232" class="label">预算充足</text><path d="M500 183H580" class="edge"/><text x="520" y="170" class="label">超限</text><path d="M385 300V335" class="edge"/><text x="400" y="324" class="label">工具请求</text><path d="M500 272H580" class="edge"/><text x="512" y="260" class="label">满足目标</text><path d="M500 362H580" class="edge"/><text x="512" y="350" class="label">校验失败</text><path d="M385 390V425" class="edge"/><text x="400" y="414" class="label">允许</text><path d="M270 452H200" class="edge"/><text x="206" y="440" class="label">执行失败</text><path d="M385 480V520" class="edge"/><text x="400" y="505" class="label">成功</text><path d="M115 425V182H270" class="edge"/><text x="35" y="155" class="label">重试仍计预算</text><path d="M500 545H550V182H500" class="edge"/><text x="558" y="525" class="label">下一轮</text><rect x="270" y="65" width="230" height="55" rx="7" class="node accent"/><text x="385.0" y="97.5" text-anchor="middle">用户目标 + 当前状态</text><rect x="270" y="155" width="230" height="55" rx="7" class="node "/><text x="385.0" y="187.5" text-anchor="middle">检查步数 / 时间 / 成本</text><rect x="270" y="245" width="230" height="55" rx="7" class="node accent"/><text x="385.0" y="277.5" text-anchor="middle">调用模型，接收输出</text><rect x="270" y="335" width="230" height="55" rx="7" class="node "/><text x="385.0" y="367.5" text-anchor="middle">验证工具名、参数与权限</text><rect x="270" y="425" width="230" height="55" rx="7" class="node accent"/><text x="385.0" y="457.5" text-anchor="middle">应用执行工具</text><rect x="30" y="425" width="170" height="55" rx="7" class="node "/><text x="115.0" y="457.5" text-anchor="middle">记录失败 / 有界重试</text><rect x="580" y="155" width="170" height="55" rx="7" class="node "/><text x="665.0" y="187.5" text-anchor="middle">预算耗尽 → 停止</text><rect x="580" y="245" width="170" height="55" rx="7" class="node "/><text x="665.0" y="277.5" text-anchor="middle">最终回答 → 结束</text><rect x="580" y="335" width="170" height="55" rx="7" class="node "/><text x="665.0" y="367.5" text-anchor="middle">越权 / 无效 → 拒绝</text><rect x="270" y="520" width="230" height="50" rx="7" class="node "/><text x="385.0" y="550.0" text-anchor="middle">结果与调用 ID 写入状态</text></svg>